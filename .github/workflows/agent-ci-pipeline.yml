name: Agent-Aware CI/CD Pipeline (Tiered Lanes)

"on":
  pull_request:
    branches:
      - main

jobs:
  fast-lane-static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Syntax & Unit Tests (Camada de Baixo Custo)
        run: |
          npm install
          npm run test

  restricted-lane-verifier:
    needs: fast-lane-static
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Spec Parity Check (Gemini 3 Flash Validation)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "Iniciando auditoria de Spec Drift..."
          PR_DIFF=$(git diff origin/main)
          RULES=$(cat AGENTS.md)
          
          # Hardening de Prompt para evitar regressões nas regras GT7
          jq -n \
            --arg prompt "Atue como Verifier Agent. Avalie o seguinte DIFF contra a especificação AGENTS.md. Identifique violações de contrato comportamental (ex: ignorar PP, modificar restrição de Frequência > 3.2Hz para Gr.1, ou falhas na imposição de Pneus Hard/FM6 em Endurance). Responda EXATAMENTE 'PASS' se estiver seguro, ou 'FAIL: [Motivo Técnico]' se houver Spec Drift. Especificação: $RULES | Diff: $PR_DIFF" \
            '{contents: [{parts: [{text: $prompt}]}]}' > payload.json

          # Chamada otimizada para o modelo Gemini 3 Flash via endpoint REST
          RESPONSE=$(curl -s -H "Content-Type: application/json" \
               -H "x-goog-api-key: ${GEMINI_API_KEY}" \
               -X POST -d @payload.json \
               "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.0-flash:generateContent")
          
          RESULT=$(echo $RESPONSE | jq -r '.candidates.content.parts.text')
          echo "Veredito da IA (Verifier Gate): $RESULT"
          
          if [[ "$RESULT" == *"FAIL"* ]]; then
            echo "::error::Bloqueio de Integração: Detectado desvio de especificação (Spec Drift) ou violação de contrato."
            exit 1
          fi
