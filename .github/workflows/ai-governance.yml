name: AI Governance & Spec Drift Validator (v1.69)

"on":
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  static-analysis:
    name: "Fast Lane: Syntax & Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install & Test
        run: |
          npm ci
          npm run test -- --run

  ai-verifier-gate:
    name: "Restricted Lane: AI Governance"
    needs: static-analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check API Key Availability
        id: check-key
        env:
          KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "available=false" >> $GITHUB_OUTPUT
            echo "::warning::GEMINI_API_KEY não configurada. Pulando AI Governance Gate."
          else
            echo "available=true" >> $GITHUB_OUTPUT
          fi

      - name: Spec Parity Check with Hardened Prompt
        if: steps.check-key.outputs.available == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          PR_DIFF=$(git diff origin/main)
          RULES=$(cat Agents.md)
          
          # Injeção de tags XML para isolamento de contexto e hardening
          jq -n \
            --arg prompt "Atue como Auditor de AppSec e Verifier Agent.
            <Constraints>
            1. Aplique estritamente as regras de física do GT7 v1.69.
            2. Rejeite qualquer código que permita manipular o PP usando relações de transmissão.
            3. Considere a degradação térmica acelerada de pneus por excesso de camber.
            4. Permita o processamento de veículos Gr.X (Elétricos) com mais de 1.500 BHP.
            </Constraints>
            <Analyze>
            Avalie o seguinte DIFF de código contra o Agents.md. O código lida corretamente com a física de hypercars elétricos e bloqueia o exploit de transmissão?
            Especificação: $RULES
            Diff: $PR_DIFF
            </Analyze>
            Responda EXATAMENTE 'PASS' ou 'FAIL: [Motivo Técnico]'." \
            '{contents: [{parts: [{text: $prompt}]}]}' > payload.json

          RESPONSE=$(curl -s -H "Content-Type: application/json" \
               -H "x-goog-api-key: ${GEMINI_API_KEY}" \
               -X POST -d @payload.json \
               "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.0-flash:generateContent")
          
          RESULT=$(echo $RESPONSE | jq -r '.candidates.content.parts.text')
          echo "Veredito da IA (Verifier Gate): $RESULT"
          
          if [[ "$RESULT" == *"FAIL"* ]]; then
            echo "::error::Bloqueio de Integração: Detectado desvio de especificação (Spec Drift) contra as regras da v1.69."
            exit 1
          fi
