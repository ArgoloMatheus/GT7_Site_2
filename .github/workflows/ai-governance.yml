name: AI Governance & Spec Drift Validator (v1.69)

"on":
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  static-analysis:
    name: "Fast Lane: Syntax & Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install & Test
        run: |
          npm ci
          npm run test -- --run

  ai-verifier-gate:
    name: "Restricted Lane: AI Governance"
    needs: static-analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check API Key Availability
        id: check-key
        env:
          KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "available=false" >> $GITHUB_OUTPUT
            echo "::warning::GEMINI_API_KEY não configurada. Pulando AI Governance Gate."
          else
            echo "available=true" >> $GITHUB_OUTPUT
          fi

      - name: Spec Parity Check (Gemini 3 Flash Validation)
        if: steps.check-key.outputs.available == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "Iniciando auditoria de Spec Drift contra AGENTS.md..."

          # Extração segura de contexto
          RULES=$(cat AGENTS.md)
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
            if [ "$BASE" == "0000000000000000000000000000000000000000" ] || [ -z "$BASE" ]; then BASE="HEAD~1"; fi
          fi
          PR_DIFF=$(git diff "$BASE"...HEAD 2>/dev/null || echo "")

          if [ -z "$PR_DIFF" ]; then
            echo "::notice::Nenhum diff detectado. Pulando verificação de Spec Drift."
            exit 0
          fi

          # Blindagem de Parsing: Usando --arg do jq para evitar injeção de shell no JSON
          jq -n \
            --arg rules "$RULES" \
            --arg diff "$PR_DIFF" \
            --arg prompt_template "Atue como Verifier Agent especializado em GT7. Avalie o seguinte DIFF contra a especificação AGENTS.md. Identifique violações de contrato comportamental (ex: ignorar PP, modificar restrição de Frequência > 3.2Hz para Gr.1, ou falhas na imposição de Pneus Hard/FM6 em Endurance). Se as mudanças forem apenas de CI/CD, infraestrutura ou formatação YAML, responda PASS. Responda EXATAMENTE 'PASS' se estiver seguro, ou 'FAIL: [Motivo Técnico]' se houver Spec Drift." \
            '{contents: [{parts: [{text: ($prompt_template + "\n\n### ESPECIFICAÇÃO (AGENTS.md):\n" + $rules + "\n\n### MUDANÇAS (DIFF):\n" + $diff)}]}]}' > payload.json

          # Chamada ao modelo Gemini 3 Flash
          HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" \
               -H "Content-Type: application/json" \
               -H "x-goog-api-key: ${GEMINI_API_KEY}" \
               -X POST -d @payload.json \
               "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.0-flash:generateContent")

          echo "HTTP Status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::warning::API Gemini retornou HTTP $HTTP_CODE. Verifique a chave e o endpoint."
            cat response.json
            exit 1
          fi

          RESULT=$(cat response.json | jq -r '.candidates[0].content.parts[0].text // empty')

          if [ -z "$RESULT" ]; then
            echo "::warning::Resposta da IA vazia ou inválida."
            cat response.json
            exit 1
          fi

          echo "Veredito da IA (Governance Gate): $RESULT"

          if [[ "$RESULT" == *"FAIL"* ]]; then
            echo "::error title=AI Governance Failure::Detectado desvio de especificação (Spec Drift). Verifique o AGENTS.md."
            exit 1
          fi

          echo "✅ AI Governance Gate: PASS"
